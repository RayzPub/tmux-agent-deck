# System-wide tmux configuration for CCNOW Docker Sandbox
# Stored in /etc/tmux.conf so it is never shadowed by the /home/node bind mount.

set -g mouse on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g history-limit 50000
set -s escape-time 10
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g default-shell /bin/bash
set -g update-environment "ANTHROPIC_BASE_URL ANTHROPIC_API_KEY ANTHROPIC_MODEL OPENAI_BASE_URL OPENAI_API_BASE OPENAI_API_KEY OPENAI_MODEL CODEX_MODEL CLAUDE_CODE_DISABLE_UNKNOWN_MODEL_WINDOW_ENFORCEMENT TERM COLORTERM LANG LC_ALL"
