<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  
      <defs>
        <linearGradient id="bg-hexagon" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0b162c"/>
          <stop offset="100%" stop-color="#040915"/>
        </linearGradient>
        <linearGradient id="grad-hexagon" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#00f0ff"/>
          <stop offset="100%" stop-color="#0090ff"/>
        </linearGradient>
        <filter id="glow-hexagon" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="22" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      
      <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#bg-hexagon)" stroke="#00f0ff" stroke-width="12" stroke-opacity="0.8"/>
      
      <!-- Outer Hexagon -->
      <g filter="url(#glow-hexagon)">
        <polygon points="512,180 800,346 800,678 512,844 224,678 224,346" fill="none" stroke="url(#grad-hexagon)" stroke-width="26" stroke-linejoin="round"/>
        <!-- Inner segmented Hexagon -->
        <polygon points="512,280 710,394 710,630 512,744 314,630 314,394" fill="none" stroke="#00f0ff" stroke-width="10" stroke-dasharray="36 18" stroke-opacity="0.7"/>
        <!-- Core Node -->
        <circle cx="512" cy="512" r="76" fill="url(#grad-hexagon)"/>
        <circle cx="512" cy="512" r="32" fill="#ffffff"/>
      </g>

      <!-- Corner nodes -->
      <circle cx="512" cy="180" r="14" fill="#00f0ff"/>
      <circle cx="800" cy="346" r="14" fill="#00f0ff"/>
      <circle cx="800" cy="678" r="14" fill="#00f0ff"/>
      <circle cx="512" cy="844" r="14" fill="#00f0ff"/>
      <circle cx="224" cy="678" r="14" fill="#00f0ff"/>
      <circle cx="224" cy="346" r="14" fill="#00f0ff"/>
    
</svg>