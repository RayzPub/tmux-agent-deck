<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  
      <defs>
        
    <linearGradient id="bg-hexagon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1024" y2="1024">
      <stop offset="0%" stop-color="#222532"/>
      <stop offset="52%" stop-color="#17191e"/>
      <stop offset="100%" stop-color="#101218"/>
    </linearGradient>
    <radialGradient id="ambient-hexagon" gradientUnits="userSpaceOnUse" cx="512" cy="472" r="540">
      <stop offset="0%" stop-color="#7e66f5" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#6952d9" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#101218" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grad-hexagon" gradientUnits="userSpaceOnUse" x1="200" y1="200" x2="824" y2="824">
      <stop offset="0%" stop-color="#d8ceff"/>
      <stop offset="48%" stop-color="#ac9bff"/>
      <stop offset="100%" stop-color="#6952d9"/>
    </linearGradient>
    <filter id="soft-glow-hexagon" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="blur"/>
      <feFlood flood-color="#ac9bff" flood-opacity="0.26" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  
        <radialGradient id="core-hex" cx="38%" cy="35%" r="65%">
          <stop offset="0%" stop-color="#d8ceff"/>
          <stop offset="55%" stop-color="#ac9bff"/>
          <stop offset="100%" stop-color="#6952d9"/>
        </radialGradient>
      </defs>

      
    <!-- Full-bleed borderless background (iOS/Android/PWA safe-zone friendly) -->
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bg-hexagon)"/>
    <rect x="0" y="0" width="1024" height="1024" fill="url(#ambient-hexagon)"/>
  

      <!-- Outer & Inner Architectural Hexagon -->
      <g filter="url(#soft-glow-hexagon)">
        <polygon points="512,188 792,350 792,674 512,836 232,674 232,350" fill="none" stroke="url(#grad-hexagon)" stroke-width="36" stroke-linejoin="round"/>
        <polygon points="512,286 708,399 708,625 512,738 316,625 316,399" fill="none" stroke="#ac9bff" stroke-width="10" stroke-dasharray="42 22" stroke-opacity="0.45" stroke-linejoin="round"/>

        <!-- Core Node -->
        <circle cx="512" cy="512" r="92" fill="url(#core-hex)"/>
        <circle cx="512" cy="512" r="34" fill="#f6f4ff"/>
      </g>
    
</svg>