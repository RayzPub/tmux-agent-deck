<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  
      <defs>
        <linearGradient id="bg-neural" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0b162c"/>
          <stop offset="100%" stop-color="#040915"/>
        </linearGradient>
        <linearGradient id="grad-neural" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#00f0ff"/>
          <stop offset="100%" stop-color="#0090ff"/>
        </linearGradient>
        <filter id="glow-neural" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="22" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      
      <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#bg-neural)" stroke="#00f0ff" stroke-width="12" stroke-opacity="0.8"/>
      
      <!-- Network Links -->
      <g filter="url(#glow-neural)">
        <line x1="512" y1="270" x2="280" y2="690" stroke="url(#grad-neural)" stroke-width="20" stroke-linecap="round"/>
        <line x1="512" y1="270" x2="744" y2="690" stroke="url(#grad-neural)" stroke-width="20" stroke-linecap="round"/>
        <line x1="280" y1="690" x2="744" y2="690" stroke="url(#grad-neural)" stroke-width="20" stroke-linecap="round"/>

        <!-- Cross Links to Center -->
        <line x1="512" y1="270" x2="512" y2="550" stroke="#00f0ff" stroke-width="12" stroke-dasharray="16 12"/>
        <line x1="280" y1="690" x2="512" y2="550" stroke="#00f0ff" stroke-width="12" stroke-dasharray="16 12"/>
        <line x1="744" y1="690" x2="512" y2="550" stroke="#00f0ff" stroke-width="12" stroke-dasharray="16 12"/>

        <!-- 3 Outer Nodes -->
        <circle cx="512" cy="270" r="54" fill="url(#grad-neural)"/>
        <circle cx="512" cy="270" r="22" fill="#ffffff"/>

        <circle cx="280" cy="690" r="54" fill="url(#grad-neural)"/>
        <circle cx="280" cy="690" r="22" fill="#ffffff"/>

        <circle cx="744" cy="690" r="54" fill="url(#grad-neural)"/>
        <circle cx="744" cy="690" r="22" fill="#ffffff"/>

        <!-- Center AI Core Node -->
        <circle cx="512" cy="550" r="68" fill="url(#grad-neural)"/>
        <circle cx="512" cy="550" r="30" fill="#ffffff"/>
      </g>
    
</svg>