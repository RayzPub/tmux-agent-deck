<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  
      <defs>
        
    <linearGradient id="bg-orb" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1024" y2="1024">
      <stop offset="0%" stop-color="#222532"/>
      <stop offset="52%" stop-color="#17191e"/>
      <stop offset="100%" stop-color="#101218"/>
    </linearGradient>
    <radialGradient id="ambient-orb" gradientUnits="userSpaceOnUse" cx="512" cy="472" r="540">
      <stop offset="0%" stop-color="#7e66f5" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#6952d9" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#101218" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grad-orb" gradientUnits="userSpaceOnUse" x1="200" y1="200" x2="824" y2="824">
      <stop offset="0%" stop-color="#d8ceff"/>
      <stop offset="48%" stop-color="#ac9bff"/>
      <stop offset="100%" stop-color="#6952d9"/>
    </linearGradient>
    <filter id="soft-glow-orb" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="blur"/>
      <feFlood flood-color="#ac9bff" flood-opacity="0.26" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  
        <radialGradient id="core-orb" cx="38%" cy="35%" r="65%">
          <stop offset="0%" stop-color="#d8ceff"/>
          <stop offset="52%" stop-color="#ac9bff"/>
          <stop offset="100%" stop-color="#6952d9"/>
        </radialGradient>
      </defs>

      
    <!-- Full-bleed borderless background (iOS/Android/PWA safe-zone friendly) -->
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bg-orb)"/>
    <rect x="0" y="0" width="1024" height="1024" fill="url(#ambient-orb)"/>
  

      <g filter="url(#soft-glow-orb)">
        <!-- Outer Precision Ring -->
        <circle cx="512" cy="512" r="306" fill="none" stroke="url(#grad-orb)" stroke-width="30"/>

        <!-- Inner Orbital Segmented Ring -->
        <circle cx="512" cy="512" r="218" fill="none" stroke="#ac9bff" stroke-width="14" stroke-dasharray="76 34" stroke-opacity="0.55" stroke-linecap="round"/>

        <!-- Inner Cardinal Axis Ticks (Cleanly Inside Outer Ring) -->
        <line x1="230" y1="512" x2="266" y2="512" stroke="#d8ceff" stroke-width="11" stroke-linecap="round" stroke-opacity="0.65"/>
        <line x1="758" y1="512" x2="794" y2="512" stroke="#d8ceff" stroke-width="11" stroke-linecap="round" stroke-opacity="0.65"/>
        <line x1="512" y1="230" x2="512" y2="266" stroke="#d8ceff" stroke-width="11" stroke-linecap="round" stroke-opacity="0.65"/>
        <line x1="512" y1="758" x2="512" y2="794" stroke="#d8ceff" stroke-width="11" stroke-linecap="round" stroke-opacity="0.65"/>

        <!-- Core Energy Sphere -->
        <circle cx="512" cy="512" r="102" fill="url(#core-orb)"/>
        <circle cx="512" cy="512" r="42" fill="#f6f4ff"/>
      </g>
    
</svg>