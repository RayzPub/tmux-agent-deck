<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  
      <defs>
        <linearGradient id="bg-cube" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0b162c"/>
          <stop offset="100%" stop-color="#040915"/>
        </linearGradient>
        <linearGradient id="top-face" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#00f0ff"/>
          <stop offset="100%" stop-color="#0090ff"/>
        </linearGradient>
        <linearGradient id="left-face" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0090ff"/>
          <stop offset="100%" stop-color="#0055c8"/>
        </linearGradient>
        <linearGradient id="right-face" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0055c8"/>
          <stop offset="100%" stop-color="#021c44"/>
        </linearGradient>
        <filter id="glow-cube" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="22" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      
      <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#bg-cube)" stroke="#00f0ff" stroke-width="12" stroke-opacity="0.8"/>
      
      <!-- Outer Cube Frame -->
      <g filter="url(#glow-cube)">
        <!-- Top Face -->
        <polygon points="512,230 750,367 512,504 274,367" fill="url(#top-face)" stroke="#ffffff" stroke-width="6" opacity="0.95"/>
        <!-- Left Face -->
        <polygon points="274,367 512,504 512,778 274,641" fill="url(#left-face)" stroke="#00f0ff" stroke-width="6" opacity="0.85"/>
        <!-- Right Face -->
        <polygon points="750,367 512,504 512,778 750,641" fill="url(#right-face)" stroke="#00f0ff" stroke-width="6" opacity="0.85"/>
        
        <!-- Center glowing vertex -->
        <circle cx="512" cy="504" r="16" fill="#ffffff"/>
      </g>
    
</svg>