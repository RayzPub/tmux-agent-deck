<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  
      <defs>
        
    <linearGradient id="bg-terminal" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1024" y2="1024">
      <stop offset="0%" stop-color="#222532"/>
      <stop offset="52%" stop-color="#17191e"/>
      <stop offset="100%" stop-color="#101218"/>
    </linearGradient>
    <radialGradient id="ambient-terminal" gradientUnits="userSpaceOnUse" cx="512" cy="472" r="540">
      <stop offset="0%" stop-color="#7e66f5" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#6952d9" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#101218" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grad-terminal" gradientUnits="userSpaceOnUse" x1="200" y1="200" x2="824" y2="824">
      <stop offset="0%" stop-color="#d8ceff"/>
      <stop offset="48%" stop-color="#ac9bff"/>
      <stop offset="100%" stop-color="#6952d9"/>
    </linearGradient>
    <filter id="soft-glow-terminal" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="blur"/>
      <feFlood flood-color="#ac9bff" flood-opacity="0.26" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  
        <linearGradient id="plate-terminal" gradientUnits="userSpaceOnUse" x1="184" y1="212" x2="840" y2="812">
          <stop offset="0%" stop-color="#282c3b" stop-opacity="0.78"/>
          <stop offset="100%" stop-color="#191c25" stop-opacity="0.86"/>
        </linearGradient>
        <linearGradient id="cursor-terminal" gradientUnits="userSpaceOnUse" x1="498" y1="670" x2="706" y2="670">
          <stop offset="0%" stop-color="#ac9bff"/>
          <stop offset="100%" stop-color="#d8ceff"/>
        </linearGradient>
      </defs>

      
    <!-- Full-bleed borderless background (iOS/Android/PWA safe-zone friendly) -->
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bg-terminal)"/>
    <rect x="0" y="0" width="1024" height="1024" fill="url(#ambient-terminal)"/>
  

      <!-- Subtle Elevated Terminal Plate (Inside Safe Zone, No Outer Border) -->
      <rect x="184" y="212" width="656" height="600" rx="68" fill="url(#plate-terminal)" stroke="#ac9bff" stroke-width="4" stroke-opacity="0.18"/>
      <line x1="184" y1="322" x2="840" y2="322" stroke="#ac9bff" stroke-width="3" stroke-opacity="0.12"/>

      <!-- Minimal Window Dots (Calm Mint Live Indicator + Lavender Tints) -->
      <circle cx="250" cy="268" r="13" fill="#64cda2" fill-opacity="0.9"/>
      <circle cx="296" cy="268" r="13" fill="#ac9bff" fill-opacity="0.45"/>
      <circle cx="342" cy="268" r="13" fill="#ac9bff" fill-opacity="0.24"/>

      <!-- Bold Prompt Symbol >_ -->
      <g filter="url(#soft-glow-terminal)">
        <polyline points="310,446 448,560 310,674" fill="none" stroke="url(#grad-terminal)" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="502" y="644" width="204" height="60" rx="30" fill="url(#cursor-terminal)"/>
      </g>
    
</svg>